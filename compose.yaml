name: briff

# Self-hosted Briff: web + worker (one image, two roles) next to Postgres 16.
# Guide: docs/SELF-HOSTING.md. Configuration: cp .env.selfhost.example .env, then edit .env.
#   docker compose pull && docker compose up -d
# Nothing is built on this host. Development uses docker-compose.dev.yml instead.

x-briff: &briff
  image: ${BRIFF_IMAGE:-ghcr.io/metelabs/briff}:${BRIFF_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    # Overrides any DATABASE_URL in .env: the app always talks to the postgres service below.
    DATABASE_URL: postgresql://briff:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/briff
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: briff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: briff
    volumes:
      - briff-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briff -d briff"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Applies pending migrations on start (MIGRATE_ON_START=false skips), then serves :3000.
  web:
    <<: *briff
    ports:
      # Loopback only: put a reverse proxy with TLS in front (docs/SELF-HOSTING.md).
      - "${BRIFF_BIND:-127.0.0.1}:${BRIFF_WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "docker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Job queue and UTC schedule; no port. Starts once web is healthy, so migrations are applied.
  worker:
    <<: *briff
    command: ["node", "dist/worker.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "docker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  briff-postgres:
