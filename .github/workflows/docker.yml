name: Docker

# Deploys are gated by release-please: a push to main only updates the release PR.
# Merging that PR creates the release, and only then is the image built and deployed.
# workflow_dispatch is an emergency escape hatch: it builds and deploys the current main
# without a release (no version tag on the image).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/briff

jobs:
  release-build-deploy:
    # A fork's own main has neither the release history nor the deploy hooks; skip there
    # instead of opening release PRs or pushing images to the fork owner's registry.
    if: ${{ github.repository == 'metelabs/briff' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Release
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@v4

      - name: Decide whether to ship
        id: ship
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual deploys run from main only (got ${GITHUB_REF})"
              exit 1
            fi
            echo "::warning::Manual deploy of ${GITHUB_SHA} without a release (emergency only)"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_CREATED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=${IMAGE}:${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release created, nothing to build or deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.ship.outputs.enabled == 'true' }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.ship.outputs.enabled == 'true' }}
      - uses: docker/login-action@v3
        if: ${{ steps.ship.outputs.enabled == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: ${{ steps.ship.outputs.enabled == 'true' }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ steps.ship.outputs.version_tag }}
          cache-from: type=gha,scope=briff
          cache-to: type=gha,mode=max,scope=briff
      # Deploy only after the image is in the registry, otherwise Dokploy pulls the old :latest.
      - name: Trigger Dokploy deploys
        if: ${{ steps.ship.outputs.enabled == 'true' }}
        env:
          DOKPLOY_WEBHOOK_WEB: ${{ secrets.DOKPLOY_WEBHOOK_WEB }}
          DOKPLOY_WEBHOOK_WORKER: ${{ secrets.DOKPLOY_WEBHOOK_WORKER }}
        run: |
          for name in WEB WORKER; do
            var="DOKPLOY_WEBHOOK_${name}"
            url="${!var}"
            if [ -z "$url" ]; then
              echo "::notice::${var} is not set, skipping ${name} deploy"
              continue
            fi
            curl -fsS -X POST "$url" -o /dev/null && echo "${name} deploy triggered"
          done
