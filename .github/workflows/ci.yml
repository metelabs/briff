name: CI

on:
  # Release PRs (release-please, opened with GITHUB_TOKEN) touch only these files. GitHub
  # creates a run for them that waits for approval before any job condition is evaluated,
  # and it expires as a failure; a path filter is evaluated before the run exists, so no run
  # is created. Any PR that also changes other files is checked as before.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - package.json
      - package-lock.json
  # A PR changing only package.json/package-lock.json (a dependency bump) skips the PR run
  # above, so these files are checked again on main after the merge.
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

# Read-only token and no secrets: a pull request from a fork gets the same run as one from
# a branch here (CONTRIBUTING.md, "CI for forks").
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: briff
          POSTGRES_PASSWORD: briff
          POSTGRES_DB: briff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U briff -d briff"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://briff:briff@localhost:5432/briff
      TEST_DATABASE_URL: postgresql://briff:briff@localhost:5432/briff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test

  # The self-hosting compose file must keep parsing with the documented env file.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (compose.yaml + .env.selfhost.example)
        run: |
          cp .env.selfhost.example .env
          sed -i -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-check|' \
            -e 's|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=ci-check-secret-of-at-least-32-characters|' .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml config --services | sort | tr '\n' ' ' | grep -qx 'postgres web worker '
          # Without the required password the file must refuse to start.
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=|' .env
          ! docker compose -f compose.yaml config --quiet 2>/dev/null
      - name: docker compose config (docker-compose.dev.yml)
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: smoke.sh syntax
        run: bash -n scripts/smoke.sh && shellcheck scripts/smoke.sh
