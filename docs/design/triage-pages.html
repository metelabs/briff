<title>Briff Triage Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ui-bg:#fafaf9;--ui-fg:#18181b;--ui-muted:#6b6b70;--ui-line:#e4e4e1;--ui-chip:#efefec;--ui-on:#18181b;--ui-on-fg:#ffffff;
  --bg:#f2f5f7;--surface:#ffffff;--surface-2:#f2f5f7;--line:#dde4e9;--line-strong:#b9c5ce;
  --fg:#0d1b24;--fg-muted:#566874;--fg-subtle:#8a99a3;
  --brand:#0b6b67;--brand-soft:#d9eeec;--on-brand:#ffffff;
  --sec:#b93522;--sec-soft:#fde6e0;--read:#3659b8;--read-soft:#e3eafb;--upgrade:#8a560a;--upgrade-soft:#fbefd9;
  --wait:#5a6973;--wait-soft:#e8edf0;--ok:#1a6b43;--ok-soft:#dcf1e4;--code:#ffffff;
  --shadow:rgba(13,27,36,.07);--scrim:rgba(10,17,21,.45);--barbg:rgba(242,245,247,.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ui-bg:#111113;--ui-fg:#ededee;--ui-muted:#9a9aa1;--ui-line:#27272b;--ui-chip:#1c1c1f;--ui-on:#ededee;--ui-on-fg:#111113;
    --bg:#0a1115;--surface:#111a20;--surface-2:#0d161b;--line:#21303a;--line-strong:#34495a;
    --fg:#e5edf1;--fg-muted:#8d9faa;--fg-subtle:#5d6f7a;
    --brand:#3ccfc2;--brand-soft:#0e2e2d;--on-brand:#04201e;
    --sec:#ff7b64;--sec-soft:#3a1912;--read:#8eaaff;--read-soft:#192343;--upgrade:#f1b85b;--upgrade-soft:#32260f;
    --wait:#93a3ad;--wait-soft:#1b252c;--ok:#4cc98a;--ok-soft:#10291c;--code:#0d161b;
    --shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);--barbg:rgba(10,17,21,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ui-bg:#111113;--ui-fg:#ededee;--ui-muted:#9a9aa1;--ui-line:#27272b;--ui-chip:#1c1c1f;--ui-on:#ededee;--ui-on-fg:#111113;
  --bg:#0a1115;--surface:#111a20;--surface-2:#0d161b;--line:#21303a;--line-strong:#34495a;
  --fg:#e5edf1;--fg-muted:#8d9faa;--fg-subtle:#5d6f7a;
  --brand:#3ccfc2;--brand-soft:#0e2e2d;--on-brand:#04201e;
  --sec:#ff7b64;--sec-soft:#3a1912;--read:#8eaaff;--read-soft:#192343;--upgrade:#f1b85b;--upgrade-soft:#32260f;
  --wait:#93a3ad;--wait-soft:#1b252c;--ok:#4cc98a;--ok-soft:#10291c;--code:#0d161b;
  --shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);--barbg:rgba(10,17,21,.85);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--brand)}
code,.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease!important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flash{0%,100%{box-shadow:none}25%{box-shadow:0 0 0 3px var(--brand)}}
.in{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}

/* mock switch bar */
.sw{background:var(--ui-bg);border-bottom:1px solid var(--ui-line);font-size:13px;color:var(--ui-fg)}
.sw-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:9px;padding-bottom:9px}
.sw b{font-weight:600}
.seg{display:inline-flex;background:var(--ui-chip);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{padding:5px 10px;border-radius:7px;color:var(--ui-muted);font-weight:500;white-space:nowrap;transition:color .15s,background-color .2s}
.seg button:hover{color:var(--ui-fg)}
.seg button[aria-pressed="true"]{background:var(--ui-on);color:var(--ui-on-fg)}
.sw .sp{flex:1}

/* app bar */
.bar{position:sticky;top:0;z-index:30;background:var(--barbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.03em;color:var(--fg);text-decoration:none}
.logo svg{color:var(--brand)}
.pills{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none;min-width:0}
.pills a{position:relative;padding:6px 13px;border-radius:999px;color:var(--fg-muted);text-decoration:none;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s}
.pills a:hover{color:var(--fg);background:var(--bg)}
.pills a[aria-current]{background:var(--fg);color:var(--surface)}
.pills a .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--sec)}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.sp-btn{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:500;transition:border-color .15s}
.sp-btn:hover{border-color:var(--brand)}
.sp-btn i{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:12px}
.pop{position:absolute;right:42px;top:44px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px var(--shadow);padding:6px;animation:pop .18s ease-out;z-index:40}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;text-align:left;transition:background-color .12s}
.pop button:hover{background:var(--surface-2)}
.pop small{margin-left:auto;color:var(--fg-muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop a{display:block;padding:8px 10px;font-size:13px;text-decoration:none;font-weight:500}

/* page */
.wrap{max-width:1200px;margin:0 auto;padding-bottom:64px}
.wrap.wide{max-width:1440px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 22px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--fg-muted);font-size:13px}
.wk{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 10px;font-weight:600;font-family:"Geist Mono",monospace;font-size:12px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em}
.ph h1{font-weight:600;font-size:clamp(28px,3.6vw,40px);line-height:1.05;letter-spacing:-.03em;margin:8px 0 6px}
.ph p{margin:0;color:var(--fg-muted);max-width:60ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:19px;font-weight:600;line-height:1.2}
.badge{font-family:"Geist",sans-serif;font-size:12px;font-weight:500;color:var(--fg-muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;letter-spacing:0}
.h2 .more{margin-left:auto;font-family:"Geist",sans-serif;font-size:13px;font-weight:500;letter-spacing:0;text-decoration:none}
.sect{margin-top:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;transition:filter .15s,transform .1s,border-color .15s,background-color .15s,color .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:var(--on-brand)}.btn-p:hover{filter:brightness(1.08)}
.btn-s{background:var(--surface);border:1px solid var(--line);color:var(--fg)}.btn-s:hover{border-color:var(--line-strong)}
.btn-g{color:var(--fg-muted)}.btn-g:hover{color:var(--fg);background:var(--surface-2)}
.btn-d{color:var(--sec);border:1px solid var(--sec);background:var(--surface)}
.btn-df{background:var(--sec);color:var(--surface)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn-lg{height:44px;padding:0 18px;font-size:14.5px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* labels, chips */
.lbl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 8px;white-space:nowrap;line-height:1.2}
.lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.l-security,.l-critical,.l-high,.l-eol{background:var(--sec-soft);color:var(--sec)}
.l-upgrade,.l-moderate{background:var(--upgrade-soft);color:var(--upgrade)}
.l-read{background:var(--read-soft);color:var(--read)}
.l-wait,.l-low,.l-transitive{background:var(--wait-soft);color:var(--wait)}
.l-ok{background:var(--ok-soft);color:var(--ok)}
.l-direct{background:var(--brand-soft);color:var(--brand)}
.l-transitive::before,.l-direct::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:"Geist Mono",monospace;font-size:12px;border-radius:7px;padding:3px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;transition:border-color .15s,background-color .15s}
button.chip:hover{border-color:var(--brand);background:var(--brand-soft)}
.chip.eol{background:var(--sec-soft);color:var(--sec);border-color:transparent}
.chip.eol b{font-weight:600;margin-left:4px;font-family:"Geist",sans-serif;font-size:11px}
.chip .src{color:var(--fg-muted)}
.chip.eol .src{color:inherit;opacity:.85}

/* filters & inputs */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fchip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--fg-muted);transition:all .15s}
.fchip:hover{color:var(--fg);border-color:var(--line-strong)}
.fchip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.fchip span{font-family:"Geist Mono",monospace;font-size:11.5px;opacity:.8}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:36px;min-width:0;flex:0 1 260px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{border:0;background:none;outline:0;min-width:0;flex:1;font-size:13.5px}
.search svg{color:var(--fg-muted);flex:none}
.search kbd{font-family:"Geist Mono",monospace;font-size:11px;color:var(--fg-muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label,.flabel{font-size:13px;font-weight:500}
.field .help{font-size:12.5px;color:var(--fg-muted)}
.input,.select,textarea.input{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;width:100%;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.input:focus,.select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.toggle{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line-strong);flex:none;transition:background-color .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s cubic-bezier(.3,.8,.2,1)}
.toggle[aria-checked="true"]{background:var(--brand)}
.toggle[aria-checked="true"]::after{transform:translateX(16px)}
.check{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background-color .12s}
.check:hover{background:var(--surface-2)}
.check input{accent-color:var(--brand);width:16px;height:16px;margin:0}
.check .mono{font-size:13px}
.check small{margin-left:auto;color:var(--fg-muted);font-size:12px}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:grid;gap:6px 16px;padding:14px 18px;border-top:1px solid var(--line);transition:background-color .15s;text-decoration:none;color:inherit}
.lrow:first-child{border-top:0}
a.lrow:hover,button.lrow:hover{background:var(--surface-2)}
.meta{color:var(--fg-muted);font-size:12.5px}
.cnt{display:flex;gap:14px;align-items:baseline;font-size:12.5px;color:var(--fg-muted);white-space:nowrap}
.cnt b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:600;color:var(--fg);letter-spacing:-.02em;margin-right:3px;font-variant-numeric:tabular-nums}
.cnt .s b{color:var(--sec)}

/* bulletin list */
.brow{grid-template-columns:auto minmax(0,1fr) auto}
.brow .sum{font-size:15px;font-weight:500;line-height:1.4;margin:0}
.brow .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.brow .st{font-size:13px;font-weight:600}

/* bulletin */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:end;padding:28px 0 26px}
.hero h1{font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.035em;margin:14px 0}
.hero h1 span{color:var(--sec)}
.hero p{margin:0;font-size:16px;color:var(--fg-muted);max-width:56ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;text-align:left;transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--shadow);border-color:var(--line-strong)}
.tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:8px;font-size:12px;color:var(--fg-muted);line-height:1.3}
.tile.s b{color:var(--sec)}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabs{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{position:relative;z-index:1;padding:7px 16px;font-weight:500;color:var(--fg-muted);transition:color .2s}
.tabs button[aria-pressed="true"]{color:var(--on-brand)}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:var(--brand);transition:transform .3s cubic-bezier(.3,.8,.2,1)}
.tabs[data-v="repo"] .ind{transform:translateX(100%)}
.hint{color:var(--fg-muted);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.scard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--sec);border-radius:16px;padding:18px;margin-bottom:12px;transition:box-shadow .25s,transform .25s cubic-bezier(.2,.7,.2,1)}
.scard:hover{box-shadow:0 10px 28px var(--shadow);transform:translateY(-1px)}
.scard h3{font-size:21px;font-weight:600;line-height:1.2;margin:10px 0 12px;text-wrap:balance}
.ctx{color:var(--fg-muted);font-size:13px;margin:10px 0 0}
.fix{margin-top:14px;border-radius:12px;background:var(--surface-2);padding:12px 12px 12px 14px;display:grid;gap:8px}
.fix small{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}
.fix p{margin:0}
.fix p code,.inl{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12.5px}
.cmd{display:flex;align-items:center;gap:8px;background:var(--code);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 12px;min-width:0}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:13px;scrollbar-width:none}
.cmd button{background:var(--brand);color:var(--on-brand);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:transform .15s,filter .15s}
.cmd button:hover{filter:brightness(1.08)}.cmd button:active{transform:scale(.96)}
.cmd button.done{background:var(--fg);color:var(--surface)}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12.5px;color:var(--fg-muted)}
.fb{display:flex;gap:4px;flex-wrap:wrap}
.fb button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--fg-muted);transition:all .15s}
.fb button:hover{color:var(--fg);border-color:var(--line-strong)}
.fb button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.know .ki{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px;transition:background-color .15s}
.know .ki:first-child{border-top:0}
.know .ki:hover{background:var(--surface-2)}
.ki h4{margin:0;font-size:15px;font-weight:500;line-height:1.35}
.ki .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ki .rr{font-family:"Geist Mono",monospace;font-size:12px;color:var(--fg-muted)}
.ki .fb{opacity:.5;transition:opacity .2s}
.ki:hover .fb,.ki:focus-within .fb{opacity:1}
.advr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.advr b{font-family:"Geist Mono",monospace;font-weight:500}
.advr span{color:var(--fg-muted);font-size:12.5px}
.folded{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-strong);border-radius:16px;padding:14px 16px;color:var(--fg-muted);width:100%;text-align:left;transition:border-color .2s,color .2s}
.folded:hover{border-color:var(--brand);color:var(--fg)}
.folded b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;color:var(--fg)}
.folded span:last-child{margin-left:auto;font-weight:500;color:var(--brand)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;transition:box-shadow .25s,transform .25s}
.rc:hover{box-shadow:0 10px 28px var(--shadow);transform:translateY(-2px)}
.rc.hot{border-color:color-mix(in srgb,var(--sec) 45%,var(--line))}
.rc header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.rc header b{font-family:"Geist Mono",monospace;font-size:14px;font-weight:500}
.rc header span{font-size:12px;color:var(--fg-muted)}
.rc header span.s{color:var(--sec);font-weight:600}
.rc ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rc li{display:grid;grid-template-columns:8px 1fr;gap:9px;align-items:baseline;font-size:13px;line-height:1.35}
.rc li i{width:8px;height:8px;border-radius:50%}

const ph=(eyebrow,title,sub,acts)=>`<header class="ph in"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:""}<h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${acts?`<div class="acts">${acts}</div>`:""}</header>`;
const parse=v=>{const [a,b]=String(v).split(".");return [+a,+(b||0)]};
function status(col,v){if(v==null)return"none";const [M,m]=parse(v),[LM,Lm]=parse(col.latest);if(col.eol&&col.eol.includes(M))return"eol";if(col.lts&&col.lts.includes(M))return"lts";if(M<LM)return"major";if(m<Lm)return"minor";return"ok"}

function shell(inner,wide){
  return `<header class="bar"><div class="bar-in gut" style="max-width:${wide?1440:1200}px">
    <a class="logo" href="#" data-go="bulletin"><svg width="22" height="22"><use href="#mark"/></svg>briff</a>
    <nav class="pills" aria-label="Main">${NAV.map(([k,n])=>`<a href="#" data-go="${k}"${(st.page===k||(k==="bulletins"&&st.page==="bulletin"))?' aria-current="page"':""}>${n}${k==="alerts"&&!empty()?'<span class="dot" aria-label="new"></span>':""}</a>`).join("")}</nav>
    <div class="bar-r"><button class="sp-btn" data-pop aria-haspopup="true"><i></i>${empty()?"My stream":st.sel}<svg width="12" height="12"><use href="#chev"/></svg></button><span class="av">FY</span></div>
  </div></header><main class="wrap${wide?" wide":""} gut">${inner}</main>`;
}

      <button class="tile" data-view="item"><b data-count="5">5</b><span>good to know</span></button>
      <button class="tile s" data-go="alerts"><b data-count="2">2</b><span>new advisories</span></button>
      <button class="tile" data-go="stack"><b data-count="332">332</b><span>folded away</span></button></div></section>
  <div class="tbar in" style="--i:2"><div class="tabs" data-v="${st.view}" role="group" aria-label="Group by"><span class="ind"></span><button data-view="item" aria-pressed="${st.view==="item"}">By item</button><button data-view="repo" aria-pressed="${st.view==="repo"}">By repo</button></div><span class="hint">Click a repo name to see everything for that repo</span></div>

P.stack=()=>{
  const head=ph(`${R.length} repos · Acme`,"Stack","What every repo runs, next to what is current. Versions come from package files, Dockerfiles and docker-compose.yml.");
  if(empty())return head+emptyState("e-layers","Nothing scanned yet","After the first scan, every repo appears here with its runtimes and key packages against the latest release.",`<a class="btn btn-p" href="#" data-go="onboarding">Connect repos</a>`);
  const rows=R.map(([n,,v])=>{const cells=COLS.map(c=>{const raw=v[c.k];const ver=Array.isArray(raw)?raw[0]:raw;return {c,ver,s:status(c,ver)}});
    const majors=cells.reduce((a,x)=>a+(x.ver&&(x.s==="major"||x.s==="eol")?parse(x.c.latest)[0]-parse(x.ver)[0]:0),0);
    return {n,cells,majors,eol:cells.some(x=>x.s==="eol"),drift:cells.some(x=>x.s!=="ok"&&x.s!=="none")}});
  const cnt={all:rows.length,drift:rows.filter(r=>r.drift).length,major:rows.filter(r=>r.majors>0).length,eol:rows.filter(r=>r.eol).length};
  const f=["all","drift","major","eol"].includes(st.filter)?st.filter:"all";
  const vis=rows.filter(r=>f==="all"||(f==="drift"&&r.drift)||(f==="major"&&r.majors>0)||(f==="eol"&&r.eol)).sort((a,b)=>b.eol-a.eol||b.majors-a.majors||a.n.localeCompare(b.n));
  const cell=x=>`<td>${x.s==="none"?`<span class="v v-none">–</span>`:`<span class="v v-${x.s}"${x.s==="lts"?' title="Supported LTS line"':""}>${x.ver}${x.s==="eol"?"<small>EOL</small>":x.s==="major"?`<small>−${parse(x.c.latest)[0]-parse(x.ver)[0]}</small>`:x.s==="lts"?"<small>LTS</small>":""}</span>`}</td>`;
  return head+`<div class="filters in" style="--i:1">${[["all","All repos"],["drift","Any drift"],["major","Majors behind"],["eol","End of life"]].map(([k,n])=>`<button class="fchip" data-filter="${k}" aria-pressed="${f===k}">${n} <span>${cnt[k]}</span></button>`).join("")}<label class="search" style="margin-left:auto"><svg width="15" height="15"><use href="#srch"/></svg><input placeholder="Repo or package" aria-label="Filter repos or packages"><kbd>/</kbd></label></div>
  <div class="tw in" style="--i:2"><table class="drift"><thead><tr><th>Repo</th>${COLS.map(c=>`<th>${c.n}<small>latest ${c.latest}${c.note?" "+c.note:""}</small></th>`).join("")}<th>Majors behind</th></tr></thead>
  <tbody>${vis.map(r=>`<tr><td>${r.n}</td>${r.cells.map(cell).join("")}<td><span class="behind" style="color:${r.eol?"var(--sec)":r.majors?"var(--upgrade)":"var(--ok)"}">${r.majors}</span></td></tr>`).join("")}</tbody></table></div>
  <div class="legend"><span class="v v-ok">current</span><span class="v v-minor">minor behind</span><span class="v v-lts">22<small>LTS</small></span><span>older but supported</span><span class="v v-major">major behind <small>−n</small></span><span class="v v-eol">end of life <small>EOL</small></span><span>Versions shown are illustrative for this mock.</span></div>`;
};

};
P.login=()=>`<main class="solo gut"><a class="logo" href="#"><svg width="24" height="24"><use href="#mark"/></svg>briff</a>
  <h1 class="in">Sign in to Briff</h1><p class="lead in" style="--i:1">A weekly bulletin built from your own stack: what to fix, what to know, and nothing else.</p>
  <div class="in" style="--i:2"><button class="btn btn-s btn-lg" style="width:100%"><svg width="18" height="18"><use href="#gh"/></svg>Continue with GitHub</button>
  <div class="or">or</div>
  <div class="field"><label for="le">Work email</label><input id="le" class="input" type="email" placeholder="you@studio.dev"></div>
  <button class="btn btn-p btn-lg" style="width:100%" data-toast="Check your inbox for a sign-in link">Email me a sign-in link</button>
  <p class="fine">No password. New here? The same link creates your account.</p></div></main>`;
P.onboarding=()=>{
  const yaml=`<span class="k">name</span>: briff
<span class="k">on</span>:
  <span class="k">push</span>: { branches: [main] }
  <span class="k">schedule</span>:
    - cron: "0 3 * * 1"   <span class="c"># Mondays 03:00 UTC, before your bulletin</span>
<span class="k">jobs</span>:
  <span class="k">scan</span>:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: briff-dev/scan-action@v1
        with:
          token: \${{ secrets.BRIFF_TOKEN }}`;
  const gha=`<div class="ostep"><i>1</i><div><h4>Add your token as a repo secret</h4><p>GitHub → your repo → Settings → Secrets and variables → Actions → New repository secret. Name it <code class="inl">BRIFF_TOKEN</code>.</p>${cmdBox("brf_live_7Qm2••••••••••••••••Xc")}</div></div>
    <div class="ostep"><i>2</i><div><h4>Add the workflow</h4><p>Save as <code class="inl">.github/workflows/briff.yml</code>. It only reads lockfiles, Dockerfiles and compose files.</p><pre class="code"><button class="btn btn-s btn-sm cpy" data-copy="briff.yml">Copy</button>${yaml}</pre></div></div>
    <div class="ostep"><i>3</i><div><h4>Push, and the repo appears here</h4><div class="wait"><i></i><div><b style="font-weight:500">Waiting for the first scan</b><div class="meta">Nothing received yet. This updates by itself.</div></div></div></div></div>`;
  const local=`<div class="ostep"><i>1</i><div><h4>Run the scanner over your code folder</h4><p>Needs Node 20 or newer. It reads each repo's lockfiles, Dockerfiles and compose files, and sends only package names and versions.</p>${cmdBox("npx @briff/scan ~/code --token brf_live_7Qm2••••Xc")}</div></div>
    <div class="ostep"><i>2</i><div><h4>Check what it found</h4><p>It lists every repo first and asks before sending. Use <code class="inl">--exclude</code> to skip folders.</p></div></div>
    <div class="ostep"><i>3</i><div><h4>Run it again whenever you like</h4><p>Add it to cron for weekly freshness, or switch a repo to the GitHub Action later.</p><div class="wait"><i></i><div><b style="font-weight:500">Waiting for the first scan</b><div class="meta">Nothing received yet.</div></div></div></div></div>`;
  return `<header class="bar"><div class="bar-in gut" style="max-width:620px"><a class="logo" href="#"><svg width="22" height="22"><use href="#mark"/></svg>briff</a><div class="bar-r"><a href="#" data-go="login" class="btn btn-g btn-sm">Sign out</a></div></div></header>
  <main class="solo w gut"><div class="steps in"><span class="done"><i>✓</i>Stream</span><span class="ln"></span><span class="cur"><i>2</i>Connect repos</span><span class="ln"></span><span><i>3</i>First bulletin</span></div>
  <h1 class="in" style="--i:1">Connect your repos</h1><p class="lead in" style="--i:2">Briff never needs write access. Pick one way now; you can mix both later.</p>
  <div class="tbar in" style="--i:3"><div class="tabs" data-v="${st.view==="repo"?"repo":"item"}" role="group" aria-label="Method"><span class="ind"></span><button data-view="item" aria-pressed="${st.view!=="repo"}">GitHub Action</button><button data-view="repo" aria-pressed="${st.view==="repo"}">Local scanner</button></div><span class="hint">${st.view==="repo"?"Good for private or non-GitHub repos":"Recommended: keeps every repo fresh"}</span></div>
  <div class="card pad in" style="--i:4">${st.view==="repo"?local:gha}</div>
  <div class="ofoot"><a href="#" class="btn btn-g" data-go="bulletin">Skip for now</a><button class="btn btn-p" disabled>Continue</button></div>
  <p class="fine">Token, action and CLI names are placeholders in this mock.</p></main>`;
};

/* ---------- shell plumbing ---------- */
function render(){
  const p=st.page;
  const solo=p==="login"||p==="onboarding";
  app.innerHTML=solo?P[p]():shell(P[p](),p==="stack");
  root.setAttribute("data-page",p);
  document.querySelectorAll("#pageSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===p)));
  document.querySelectorAll("#dataSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.state===st.state)));
  if(p==="bulletin"&&!empty()&&st.view==="item"&&!reduce()&&!render.counted){render.counted=true;countUp()}
}
function go(p){if(p!==st.page){st.page=p;st.filter="all";if(p!=="onboarding"&&p!=="bulletin")st.view="item";if(p==="onboarding")st.view="item";store.set("briff-pages-page",p);render();window.scrollTo(0,0)}}
function countUp(){app.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,t0=performance.now(),d=to>20?900:500;el.textContent="0";const s=n=>{const q=Math.min(1,(n-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-q,3)));if(q<1)requestAnimationFrame(s)};requestAnimationFrame(s)})}
function setTheme(t,anim){
  if(anim&&!reduce()){root.classList.add("theming");clearTimeout(setTheme.t);setTheme.t=setTimeout(()=>root.classList.remove("theming"),350)}
  if(t==="light"||t==="dark")root.setAttribute("data-theme",t);else root.removeAttribute("data-theme");
  document.querySelectorAll("#themeSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===(t||"system"))));
}
let toastT;
function toast(msg){layer.querySelectorAll(".toast").forEach(t=>t.remove());const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML=`<svg width="16" height="16"><use href="#ok"/></svg>${msg}`;layer.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2500)}
let lastFocus;
function dialog(kind){
  lastFocus=document.activeElement;
  const D=kind==="delete"?{t:"Delete your account?",b:"This removes your repos, scans, streams and every bulletin. Same-day alerts stop at once. This can't be undone.",a:`<button class="btn btn-s" data-close>Cancel</button><button class="btn btn-df" data-close data-toast="Account deletion scheduled">Delete account</button>`}
   :{t:"New stream",b:"A stream gets its own bulletin. You pick its repos next.",f:`<div class="field"><label for="sn">Name</label><input id="sn" class="input" placeholder="e.g. Client sites"></div>`,a:`<button class="btn btn-s" data-close>Cancel</button><button class="btn btn-p" data-close data-toast="Stream created">Create stream</button>`};
  layer.insertAdjacentHTML("beforeend",`<div class="scrim" data-scrim><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${D.t}</h3><p>${D.b}</p>${D.f||""}<div class="acts">${D.a}</div></div></div>`);
  const f=layer.querySelector(".dlg input,.dlg button");f&&f.focus();
}
function closeDialog(){const s=layer.querySelector("[data-scrim]");if(s){s.remove();lastFocus&&lastFocus.focus()}}
function copy(btn){const t=btn.dataset.copy,l=btn.textContent;try{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}btn.classList.add("done");btn.textContent="Copied";toast("Copied to clipboard");setTimeout(()=>{btn.classList.remove("done");btn.textContent=l},1400)}

document.getElementById("pageSeg").innerHTML=PAGES.map(([k,n])=>`<button data-p="${k}">${n}</button>`).join("");
document.getElementById("pageSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.p)});
document.getElementById("dataSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){st.state=b.dataset.state;st.sel=b.dataset.state==="empty"?"My stream":"Acme";store.set("briff-pages-state",st.state);render()}});
document.getElementById("themeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){setTheme(b.dataset.t,true);store.set("briff-pages-theme",b.dataset.t)}});
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-scrim]")&&!t.closest(".dlg")){closeDialog();return}
  const c=t.closest("[data-copy]");if(c){copy(c);return}
  const ts=t.closest("[data-toast]");if(ts){toast(ts.dataset.toast);if(ts.hasAttribute("data-close"))closeDialog();return}
  if(t.closest("[data-close]")){closeDialog();return}
  const pop=layer.querySelector(".pop")||app.querySelector(".pop");
  if(t.closest("[data-pop]")){if(pop){pop.remove()}else{t.closest(".bar-r").insertAdjacentHTML("beforeend",`<div class="pop" role="menu">${(empty()?[["My stream",0]]:[["Acme",15],["Client work",6]]).map(([n,c])=>`<button role="menuitem" data-stream="${n}">${n===st.sel?"✓":"&nbsp;&nbsp;"} ${n}<small>${c} repos</small></button>`).join("")}<hr><a href="#" data-go="streams">Manage streams</a></div>`)}return}
  if(pop&&!t.closest(".pop"))pop.remove();
  const f=t.closest("[data-fb]");if(f){const on=f.getAttribute("aria-pressed")!=="true";f.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false"));f.setAttribute("aria-pressed",String(on));return}
  const ms=t.closest("[data-ms]");if(ms){ms.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===ms)));return}
  const tg=t.closest("[data-tg]");if(tg){tg.setAttribute("aria-checked",String(tg.getAttribute("aria-checked")!=="true"));return}
  const dl=t.closest("[data-dialog]");if(dl){dialog(dl.dataset.dialog);return}
  const s=t.closest("[data-stream]");if(s){st.sel=s.dataset.stream;if(st.page==="streams"||t.closest(".pop"))render();return}
  const g=t.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return}
  const v=t.closest("[data-view]");if(v){st.view=v.dataset.view;render();return}
  const fl=t.closest("[data-filter]");if(fl){st.filter=fl.dataset.filter;render();return}
  const sv=t.closest("[data-sev]");if(sv){st.sev=sv.dataset.sev;render();return}
  const gr=t.closest("[data-gorepo]");if(gr){st.view="repo";render();const card=app.querySelector(`[data-repo="${gr.dataset.gorepo}"]`);if(card){card.scrollIntoView({block:"center",behavior:reduce()?"auto":"smooth"});card.classList.add("flash")}return}
  const a=t.closest('a[href^="#"]');if(a&&a.getAttribute("href")==="#")e.preventDefault();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDialog();const p=document.querySelector(".pop");p&&p.remove()}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const s=app.querySelector(".search input");if(s){e.preventDefault();s.focus()}}
});
window.addEventListener("scroll",()=>{const b=app.querySelector(".bar");b&&b.classList.toggle("scrolled",window.scrollY>8)},{passive:true});

/* Attributes already on the root element win over stored preferences. */
const pg=root.getAttribute("data-page")||store.get("briff-pages-page")||"bulletin";
st.page=PAGES.some(p=>p[0]===pg)?pg:"bulletin";
st.state=root.getAttribute("data-state")||store.get("briff-pages-state")||"full";
if(st.state==="empty")st.sel="My stream";
setTheme(root.getAttribute("data-theme")||store.get("briff-pages-theme")||"system",false);
render();
})();
</script>
